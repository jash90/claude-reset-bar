[package]
name = "claude-reset-bar"
version = "2.0.0"
edition = "2021"
description = "Claude usage limits in the menu bar / system tray, with a notification when a limit resets"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
keyring = "4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
png = "0.18"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = "3"

# The tray. Windows and macOS go through tray-icon; Linux talks StatusNotifierItem over
# D-Bus directly, which needs no GTK and keeps the binary free of runtime libraries.
[target.'cfg(not(target_os = "linux"))'.dependencies]
sys-locale = "0.3"
tao = "0.37"
tray-icon = "0.26"

# macOS posts its notifications through osascript, as the native app always has.
[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4"

# Brings the accounts window to the front on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
